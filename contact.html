<!DOCTYPE html>
<html>

<head>

    <title>Contact - My Handicrafts Store</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header>

        <h1>My Handicrafts Store</h1>

        <div class="menu">

            <a href="index.html">Home</a>
            <a href="product.html">Product</a>
            <a href="gallery.html">Gallery</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>

        </div>

    </header>

    <main>

        <h2 class="contact-title">
            Contact Us
        </h2>

        <form class="contact-form"
              action="process.php"
              method="post"
              onsubmit="return validateForm()">

            <label>
                Full Name
            </label>

            <input type="text"
                id="name">

            <label>
                Email
            </label>

            <input type="email"
                id="email">

            <label>
                Phone Number
            </label>

            <input type="text"
                id="phone">

            <label>
                Message
            </label>

            <textarea id="message"
                rows="5"></textarea>

            <button type="submit">
                Submit
            </button>

        </form>

    </main>

    <footer>

        <p>
            © 2026 My Handicrafts Store
        </p>

    </footer>

    <script src="js/script.js"></script>

</body>

</html>
